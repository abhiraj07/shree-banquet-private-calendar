<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset Admin Password | Shree Banquet Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#042A21;--g2:#063B2F;--gold:#C89B3C;--gl:#E8CD8A;--cream:#FAF6EC;--ink:#1C241F;--muted:#69736d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:Jost,sans-serif;display:grid;place-items:center;padding:20px}
.panel{width:min(100%,440px);background:#fff;border:1px solid rgba(200,155,60,.32);border-radius:18px;box-shadow:0 18px 50px -35px #042a2170;padding:28px}
h1{font:600 34px "Cormorant Garamond",serif;color:var(--g);margin:0 0 8px}p{color:var(--muted);margin:0 0 22px;line-height:1.5}
label{display:block;margin:16px 0;font-size:13px;font-weight:600}input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #d9ded9;border-radius:10px;font:16px Jost,sans-serif}
button{width:100%;border:0;border-radius:10px;padding:13px;cursor:pointer;font:600 15px Jost,sans-serif;background:linear-gradient(135deg,var(--gl),var(--gold));color:var(--g)}
button:disabled{opacity:.5;cursor:wait}.message{min-height:22px;margin-top:14px;font-size:14px;color:#a52e2e}.back{display:block;text-align:center;margin-top:18px;color:var(--g);font-size:14px;text-decoration:none}
</style>
</head>
<body>
<main class="panel">
<h1>Reset Admin Password</h1>
<p>Choose a new password for the Shree Banquet Hall admin account.</p>
<form id="resetForm" class="hidden">
<label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
<label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
<button id="saveButton" type="submit">Update password</button>
</form>
<div id="message" class="message" role="status">Verifying your secure reset link…</div>
<a class="back" href="./admin.html">Back to Admin Login</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://agshupnzhpeqiwezsnyp.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_-gIJozghyFLW9TQfwY3FxA_OWZI097M';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let recoveryReady=false;
const hasRecoveryMarker=()=>location.hash.includes('type=recovery')||new URLSearchParams(location.search).has('code');
function setMessage(message,isError=false){$('message').textContent=message;$('message').style.color=isError?'#a52e2e':'#236b38'}
db.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'&&session){recoveryReady=true;$('resetForm').classList.remove('hidden');setMessage('Secure link verified. Enter your new password.')}
});
(async()=>{
 const {data:{session},error}=await db.auth.getSession();
 if(error){setMessage('Could not verify this reset link. Request a new link from Admin Login.',true);return}
 if(session&&hasRecoveryMarker()){recoveryReady=true;$('resetForm').classList.remove('hidden');setMessage('Secure link verified. Enter your new password.');return}
 if(!recoveryReady)setMessage('This reset link is invalid or expired. Return to Admin Login and request a new one.',true);
})();
$('resetForm').addEventListener('submit',async event=>{
 event.preventDefault();
 if(!recoveryReady){setMessage('Please open the latest password reset email link first.',true);return}
 const password=$('newPassword').value,confirm=$('confirmPassword').value;
 if(password.length<8){setMessage('Use a password with at least 8 characters.',true);return}
 if(password!==confirm){setMessage('The passwords do not match.',true);return}
 $('saveButton').disabled=true;setMessage('Updating password…');
 const {error}=await db.auth.updateUser({password});
 $('saveButton').disabled=false;
 if(error){setMessage('Password could not be updated. The link may have expired; request a new one.',true);return}
 await db.auth.signOut();
 $('resetForm').classList.add('hidden');
 setMessage('Password updated successfully. Return to Admin Login and sign in with your new password.');
});
</script>
</body>
</html>
